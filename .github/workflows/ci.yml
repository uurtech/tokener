name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gateway/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke
        env: { AWS_ACCESS_KEY_ID: AKIACISMOKE0000000000, AWS_SECRET_ACCESS_KEY: ci-smoke-not-real }
      - run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64
          push: false
          load: true
          tags: tokener:ci
          build-args: VERSION=ci
      - name: Container starts and serves /health + admin console
        run: |
          cid=$(docker run -d -p 18080:8080 -e STORE=sqlite -e ADMIN_TOKEN=ci -e AWS_REGION=us-east-1 -e MODEL_CATALOG_ENABLED=0 -e AWS_ACCESS_KEY_ID=AKIATEST -e AWS_SECRET_ACCESS_KEY=test tokener:ci)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:18080/admin/
          test "$(docker exec $cid id -u)" = 1000
          docker stop $cid

  template:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: infra/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run build
      - run: npm run synth:marketplace
      - run: pip install cfn-lint && cfn-lint --non-zero-exit-code error dist/tokener-marketplace.template.json
      - uses: actions/upload-artifact@v4
        with: { name: tokener-marketplace-template, path: infra/dist/tokener-marketplace.template.json }
