# Local run in a container: SQLite store + admin UI, Bedrock via your ~/.aws credentials.
#   ADMIN_TOKEN=secret docker compose up --build
services:
  gateway:
    build: .
    ports: ["8080:8080"]
    environment:
      STORE: sqlite
      SQLITE_PATH: /app/data/gateway.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      EFFORT_MODE: ${EFFORT_MODE:-off}
    volumes:
      - gateway-data:/app/data
      - ~/.aws:/home/node/.aws:ro
volumes:
  gateway-data:
