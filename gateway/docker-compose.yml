# Local run in a container: SQLite store + admin UI, Bedrock via your ~/.aws credentials.
#   ADMIN_TOKEN=secret docker compose up --build
services:
  gateway:
    build: .
    ports: ["127.0.0.1:8080:8080"]   # localhost only
    environment:
      STORE: sqlite
      SQLITE_PATH: /app/data/gateway.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN to a long random value}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      EFFORT_MODE: ${EFFORT_MODE:-off}
    volumes:
      - gateway-data:/app/data
      - ~/.aws:/home/node/.aws:ro
volumes:
  gateway-data:
